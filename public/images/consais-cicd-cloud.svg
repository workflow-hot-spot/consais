  <style>.title{font:600 20px Arial,sans-serif;fill:#fff}.label{font:600 16px Arial,sans-serif;fill:#fff}.small{font:14px Arial,sans-serif;fill:#94a3b8}.box{fill:#fff;fill-opacity:.05;stroke:#5d7082;stroke-width:2}.accent{fill:#38bdf8;fill-opacity:.08;stroke:#67e8f9;stroke-width:2}.line{stroke:#7b8c9d;stroke-width:3;fill:none}.arrow{fill:#7b8c9d}</style>
